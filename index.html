<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TEMPERATURE CONVERTER</h1>
    <form>
        <label for="kelvin">from Celsius to kelvin:</label>
        <input type="radio" id="kelvin" name="temperature">
        <label for="celsius">from Kelvin to Celsius:</label>
        <input type="radio" id="celsius" name="temperature">
        <br>
        <input type="text" id="inputValue" placeholder="Enter value">
        <br>
        <button id="convertbtn" type="button">Convert</button>
        <p id="outputValue">Give a value to convert</p>
    </form>
</body>
<script src="learn.js"></script>
</html>
